x-app-env: &app-env
  DEBUG: "True"
  SECRET_KEY: django-insecure-dev-only-change-in-production
  ALLOWED_HOSTS: localhost,127.0.0.1
  POSTGRES_DB: app_db
  POSTGRES_USER: app_user
  POSTGRES_PASSWORD: secret
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  DEFAULT_FROM_EMAIL: studio@detailflow.pl

services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    entrypoint: []
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_started

  beat:
    build: .
    entrypoint: []
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    depends_on:
      web:
        condition: service_started
      redis:
        condition: service_started

  flower:
    build: .
    entrypoint: []
    command: celery -A config flower --port=5555
    ports:
      - "5555:5555"
    environment:
      <<: *app-env
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
