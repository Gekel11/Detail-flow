<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DetailFlow – Studio Management System{% endblock %}</title>
    <!-- Tailwind CSS z CDN dla nowoczesnego wyglądu bez konfigurowania node/npm -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <!-- Pasek nawigacji -->
    <nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <a href="{% url 'dashboard' %}" class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">DetailFlow</a>
            <span class="text-xs bg-blue-900/60 text-blue-300 font-semibold px-2.5 py-0.5 rounded border border-blue-700">MVT Core</span>
        </div>
        <div class="space-x-3">
            <a href="{% url 'dashboard' %}" class="text-gray-300 hover:text-white px-3 py-2 text-sm font-medium transition">Pulpit</a>
            <a href="{% url 'order_create' %}" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow">+ Przyjmij auto</a>
            <a href="/admin/" target="_blank" class="text-xs text-gray-400 hover:text-gray-200 border border-gray-700 px-3 py-2 rounded-lg transition">Panel Admina ↗</a>
        </div>
    </nav>

    <!-- Komunikaty flash messages -->
    <div class="max-w-7xl mx-auto px-6 mt-4">
        {% if messages %}
            {% for message in messages %}
                <div class="p-4 mb-4 text-sm rounded-lg bg-green-900/80 border border-green-700 text-green-200 flex items-center justify-between">
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    <!-- Główna zawartość wyrenderowana z widoków potomnych -->
    <main class="max-w-7xl mx-auto px-6 py-6">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
